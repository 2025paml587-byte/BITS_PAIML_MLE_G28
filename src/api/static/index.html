<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trip Duration Predictor</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --border: #dde1e6;
    --text: #1c1f24;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --error-bg: #fef2f2;
    --error-text: #b91c1c;
    --result-bg: #ecfdf5;
    --result-text: #065f46;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem 1rem;
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.75rem;
  }
  h1 {
    font-size: 1.35rem;
    margin: 0 0 0.25rem;
  }
  p.subtitle {
    margin: 0 0 1.5rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.9rem;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .field.full {
    grid-column: 1 / -1;
  }
  label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
  }
  input, select {
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    background: white;
    color: var(--text);
  }
  input:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    margin-top: 1.5rem;
    width: 100%;
    padding: 0.7rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: var(--muted); cursor: not-allowed; }
  .result {
    margin-top: 1.25rem;
    padding: 0.9rem 1rem;
    border-radius: 8px;
    display: none;
  }
  .result.show { display: block; }
  .result.ok {
    background: var(--result-bg);
    color: var(--result-text);
  }
  .result.error {
    background: var(--error-bg);
    color: var(--error-text);
  }
  .result .big {
    font-size: 1.4rem;
    font-weight: 700;
  }
  .result .small {
    font-size: 0.8rem;
    opacity: 0.85;
    margin-top: 0.15rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Trip Duration Predictor</h1>
    <p class="subtitle">Enter trip details and get a predicted duration from the trained models.
      &middot; <a href="/monitoring" style="color: var(--accent);">View monitoring &amp; drift demo</a>
    </p>

    <form id="trip-form">
      <div class="grid">
        <div class="field">
          <label for="algorithm">Model</label>
          <select id="algorithm" name="algorithm"></select>
        </div>
        <div class="field">
          <label for="vendor_id">Vendor ID</label>
          <select id="vendor_id" name="vendor_id">
            <option value="1">1</option>
            <option value="2">2</option>
          </select>
        </div>

        <div class="field">
          <label for="passenger_count">Passengers</label>
          <input type="number" id="passenger_count" name="passenger_count" min="0" max="9" value="1" required />
        </div>
        <div class="field">
          <label for="store_and_fwd_flag">Store &amp; Fwd Flag</label>
          <select id="store_and_fwd_flag" name="store_and_fwd_flag">
            <option value="N">N</option>
            <option value="Y">Y</option>
          </select>
        </div>

        <div class="field full">
          <label for="pickup_datetime">Pickup Date/Time</label>
          <input type="datetime-local" id="pickup_datetime" name="pickup_datetime" required />
        </div>

        <div class="field">
          <label for="pickup_latitude">Pickup Latitude</label>
          <input type="number" step="any" id="pickup_latitude" name="pickup_latitude" value="40.7580" required />
        </div>
        <div class="field">
          <label for="pickup_longitude">Pickup Longitude</label>
          <input type="number" step="any" id="pickup_longitude" name="pickup_longitude" value="-73.9855" required />
        </div>

        <div class="field">
          <label for="dropoff_latitude">Dropoff Latitude</label>
          <input type="number" step="any" id="dropoff_latitude" name="dropoff_latitude" value="40.7829" required />
        </div>
        <div class="field">
          <label for="dropoff_longitude">Dropoff Longitude</label>
          <input type="number" step="any" id="dropoff_longitude" name="dropoff_longitude" value="-73.9654" required />
        </div>
      </div>

      <button type="submit" id="submit-btn">Predict Trip Duration</button>
    </form>

    <div id="result" class="result"></div>
  </div>

<script>
  const form = document.getElementById("trip-form");
  const submitBtn = document.getElementById("submit-btn");
  const resultBox = document.getElementById("result");
  const algorithmSelect = document.getElementById("algorithm");

  function setDefaultPickupTime() {
    const now = new Date(Date.now() - new Date().getTimezoneOffset() * 60000);
    document.getElementById("pickup_datetime").value = now.toISOString().slice(0, 16);
  }

  async function loadModels() {
    try {
      const response = await fetch("/models");
      const data = await response.json();
      algorithmSelect.innerHTML = "";
      data.available_models.forEach((name) => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name.replace(/_/g, " ");
        if (name === data.default_model) option.selected = true;
        algorithmSelect.appendChild(option);
      });
    } catch (err) {
      algorithmSelect.innerHTML = '<option value="">(unable to load models)</option>';
    }
  }

  function showResult(className, html) {
    resultBox.className = `result show ${className}`;
    resultBox.innerHTML = html;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Predicting...";

    const payload = {
      vendor_id: parseInt(document.getElementById("vendor_id").value, 10),
      passenger_count: parseInt(document.getElementById("passenger_count").value, 10),
      pickup_datetime: document.getElementById("pickup_datetime").value,
      pickup_latitude: parseFloat(document.getElementById("pickup_latitude").value),
      pickup_longitude: parseFloat(document.getElementById("pickup_longitude").value),
      dropoff_latitude: parseFloat(document.getElementById("dropoff_latitude").value),
      dropoff_longitude: parseFloat(document.getElementById("dropoff_longitude").value),
      store_and_fwd_flag: document.getElementById("store_and_fwd_flag").value,
      algorithm: algorithmSelect.value || null,
    };

    try {
      const response = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await response.json();

      if (!response.ok) {
        const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
        showResult("error", `<div class="big">Request failed</div><div class="small">${detail}</div>`);
      } else {
        const seconds = data.predicted_trip_duration_seconds;
        const minutes = (seconds / 60).toFixed(1);
        showResult(
          "ok",
          `<div class="big">${seconds.toFixed(0)} seconds</div>` +
          `<div class="small">~${minutes} minutes &middot; model: ${data.model_used}</div>`
        );
      }
    } catch (err) {
      showResult("error", `<div class="big">Network error</div><div class="small">${err}</div>`);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Predict Trip Duration";
    }
  });

  setDefaultPickupTime();
  loadModels();
</script>
</body>
</html>
